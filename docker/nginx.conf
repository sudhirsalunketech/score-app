# Social/link-preview crawlers (WhatsApp, Facebook, X, Telegram, LinkedIn, ...) don't execute JS,
# so the client-rendered SPA never reaches them with real og: tags. Mirrors the same UA list and
# route mapping as apps/web/vite-crawler-og.ts (used only under `vite dev`/`vite preview`) so
# production gets the equivalent behavior: proxy crawler requests straight to the API's
# per-match/tournament `/preview` HTML endpoint instead of serving index.html.
map $http_user_agent $is_social_crawler {
  default 0;
  ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot|Googlebot|bingbot|Applebot|Iframely|SkypeUriPreview) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  location ~ ^/live/match/(?<slug>[^/]+)/?$ {
    if ($is_social_crawler = 1) {
      proxy_pass http://api:4000/api/v1/public/matches/$slug/preview;
    }
    try_files $uri /index.html;
  }

  location ~ ^/live/(?<slug>[^/]+)/?$ {
    if ($is_social_crawler = 1) {
      proxy_pass http://api:4000/api/v1/public/matches/$slug/preview;
    }
    try_files $uri /index.html;
  }

  location ~ ^/match/(?<slug>[^/]+)/?$ {
    if ($is_social_crawler = 1) {
      proxy_pass http://api:4000/api/v1/public/matches/$slug/preview;
    }
    try_files $uri /index.html;
  }

  location ~ ^/tournament/(?<slug>[^/]+)/?$ {
    if ($is_social_crawler = 1) {
      proxy_pass http://api:4000/api/v1/public/tournaments/$slug/preview;
    }
    try_files $uri /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
