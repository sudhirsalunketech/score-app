services:
  - type: web
    name: crickscore-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @crickscore/shared build && pnpm run db:generate && pnpm --filter @crickscore/api build
    startCommand: pnpm run db:migrate && pnpm --filter @crickscore/api start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_DAYS
        value: "365"
      - key: WEB_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: crickscore-redis
          property: connectionString

  - type: redis
    name: crickscore-redis
    plan: free
    region: singapore
    ipAllowList: []
