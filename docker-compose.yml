services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crickscore
      POSTGRES_PASSWORD: crickscore
      POSTGRES_DB: crickscore
    ports:
      - "5435:5432"
    volumes:
      - crickscore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crickscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://crickscore:crickscore@postgres:5432/crickscore?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      API_PORT: 4000
      APP_ENV: beta
      BETA: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: same-origin
        VITE_WS_URL: same-origin
    environment:
      VITE_API_URL: same-origin
      VITE_WS_URL: same-origin
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  crickscore_pg:
